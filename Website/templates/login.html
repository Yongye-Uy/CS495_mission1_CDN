<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — Distributed File Storage / CDN</title>
  <!-- Stock Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body class="bg-light">

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm mb-5 py-2">
    <div class="container" style="max-width: 1140px;">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-hdd-network fs-5"></i>
        <span class="fw-bold fs-6">CDN &bull; Distributed File Storage</span>
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/" class="btn btn-sm btn-outline-light">
          <i class="bi bi-arrow-left me-1"></i>Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <div class="container" style="max-width: 440px;">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 text-center border-bottom">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 48px; height: 48px;">
          <i class="bi bi-shield-lock fs-4"></i>
        </div>
        <h5 class="fw-bold mb-1">Administrator Sign In</h5>
        <small class="text-muted">Authenticate to manage cluster storage nodes</small>
      </div>

      <div class="card-body p-4">
        {{ if .Error }}
        <div class="alert alert-danger d-flex align-items-center mb-3 py-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
          <div class="small">{{ .Error }}</div>
        </div>
        {{ end }}

        <form action="/admin/login" method="POST">
          <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
          <input type="hidden" name="next" value="{{ .Next }}">

          <div class="mb-3">
            <label for="username" class="form-label small fw-bold">Admin Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username" value="admin" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small fw-bold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary fw-bold py-2">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
          </div>

          <div class="text-center">
            <a href="/" class="small text-muted text-decoration-none">
              <i class="bi bi-house me-1"></i>Return to public file gallery
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
